<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<title>Práctica de Tesis</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: #94a3b8; margin: 0 0 20px; font-size: .9rem; }
  .card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; margin: 0 0 10px; color: #a5b4fc; }
  .pregunta { font-size: 1.15rem; line-height: 1.5; margin: 6px 0 14px; }
  .etiqueta { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: #334155; }
  .etiqueta.profesor { background: #854d0e; }
  textarea, input[type=text] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: inherit; font: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  button { padding: 12px 16px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; background: #6366f1; color: white; }
  button.sec { background: #334155; }
  button:disabled { opacity: .5; }
  .fila { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .fila button { flex: 1; }
  .nota { font-size: 2rem; font-weight: 700; }
  .ok { color: #4ade80; } .mal { color: #f87171; }
  .msg { color: #94a3b8; font-size: .9rem; margin-top: 8px; }
  details summary { cursor: pointer; font-weight: 600; color: #a5b4fc; }
</style>
</head>
<body>
<main>
  <h1>Práctica de Tesis</h1>
  <p class="sub">Responde como si estuvieras frente al jurado.</p>

  <section class="card" id="zonaPregunta">
    <h2>Pregunta del día</h2>
    <div id="contenido"><p class="msg">Cargando…</p></div>
  </section>

  <section class="card" id="zonaResultado" hidden></section>

  <section class="card">
    <details>
      <summary>Agregar pregunta del profesor</summary>
      <div class="fila"><input type="text" id="nuevaPregunta" placeholder="Ej: ¿Por qué elegiste esa muestra?"></div>
      <div class="fila"><button onclick="agregarPregunta()">Guardar pregunta</button></div>
      <p class="msg" id="msgPregunta"></p>
    </details>
  </section>

  <section class="card">
    <details>
      <summary>Subir mi tesis (PDF)</summary>
      <div class="fila"><input type="file" id="archivo" accept="application/pdf"></div>
      <div class="fila"><button id="btnSubir" onclick="subirTesis()">Subir y generar preguntas</button></div>
      <p class="msg" id="msgSubir"></p>
    </details>
  </section>

  <section class="card">
    <details>
      <summary>Recordatorios</summary>
      <p class="msg">Mientras la app esté abierta, te avisará cada 2 horas si hay preguntas pendientes.</p>
      <div class="fila"><button class="sec" onclick="activarAvisos()">Activar notificaciones</button></div>
      <p class="msg" id="msgAvisos"></p>
    </details>
  </section>
</main>

<script>
let actual = null;
const $ = (id) => document.getElementById(id);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");

async function cargarPregunta() {
  $("zonaResultado").hidden = true;
  const r = await fetch("/siguiente").then(r => r.json());
  if (!r.pregunta) {
    actual = null;
    $("contenido").innerHTML = r.proxima
      ? `<p class="msg">¡Todo al día! La próxima pregunta llega el ${new Date(r.proxima).toLocaleString("es-PE")}.</p>`
      : `<p class="msg">Aún no hay preguntas. Sube tu tesis o agrega una pregunta del profesor.</p>`;
    return null;
  }
  actual = r;
  const tipo = r.origen === "profesor" ? '<span class="etiqueta profesor">Del profesor</span>' : '<span class="etiqueta">Jurado IA</span>';
  $("contenido").innerHTML = `
    ${tipo}
    <p class="pregunta">${escapar(r.pregunta)}</p>
    <textarea id="respuesta" placeholder="Escribe o dicta tu respuesta…"></textarea>
    <div class="fila">
      <button class="sec" id="btnVoz" onclick="dictar()">🎤 Dictar</button>
      <button id="btnEnviar" onclick="enviar()">Enviar respuesta</button>
    </div>`;
  return r;
}

async function enviar() {
  const texto = $("respuesta").value.trim();
  if (!texto) return;
  $("btnEnviar").disabled = true;
  $("btnEnviar").textContent = "Evaluando…";
  const ev = await fetch("/responder", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: actual.id, respuesta: texto })
  }).then(r => r.json());
  const bien = ev.nota >= 3;
  $("zonaResultado").innerHTML = `
    <h2>Resultado</h2>
    <div class="nota ${bien ? "ok" : "mal"}">${ev.nota}/5</div>
    <p>${escapar(ev.comentario)}</p>
    <p class="msg">${bien ? "¡Bien! " : "Hay que reforzarla. "}Esta pregunta vuelve en ${ev.vuelve_en}.</p>
    <div class="fila"><button onclick="cargarPregunta()">Siguiente pregunta</button></div>`;
  $("zonaResultado").hidden = false;
  $("contenido").innerHTML = '<p class="msg">Respuesta enviada.</p>';
}

function dictar() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("Tu navegador no permite dictado. Prueba con Chrome."); return; }
  const rec = new SR();
  rec.lang = "es-PE";
  rec.continuous = true;
  rec.interimResults = false;
  const caja = $("respuesta"), btn = $("btnVoz");
  btn.textContent = "⏹ Detener";
  btn.onclick = () => rec.stop();
  rec.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++)
      caja.value += (caja.value ? " " : "") + e.results[i][0].transcript;
  };
  rec.onend = () => { btn.textContent = "🎤 Dictar"; btn.onclick = dictar; };
  rec.start();
}

async function agregarPregunta() {
  const texto = $("nuevaPregunta").value.trim();
  if (!texto) return;
  await fetch("/pregunta", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ texto })
  });
  $("nuevaPregunta").value = "";
  $("msgPregunta").textContent = "Pregunta guardada. Aparecerá en tu práctica.";
  if (!actual) cargarPregunta();
}

async function subirTesis() {
  const f = $("archivo").files[0];
  if (!f) return;
  const datos = new FormData();
  datos.append("tesis", f);
  $("btnSubir").disabled = true;
  $("msgSubir").textContent = "Leyendo tu tesis y preparando preguntas… puede tardar unos minutos.";
  try {
    const r = await fetch("/subir", { method: "POST", body: datos }).then(r => r.json());
    $("msgSubir").textContent = `¡Listo! Se generaron ${r.preguntas} preguntas.`;
    cargarPregunta();
  } catch (e) {
    $("msgSubir").textContent = "Hubo un error al procesar el PDF. Intenta de nuevo.";
  }
  $("btnSubir").disabled = false;
}

async function activarAvisos() {
  const permiso = await Notification.requestPermission();
  if (permiso !== "granted") { $("msgAvisos").textContent = "No se dio permiso."; return; }
  $("msgAvisos").textContent = "Avisos activados.";
  setInterval(async () => {
    const r = await fetch("/siguiente").then(r => r.json());
    if (r.pregunta) {
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification("Tengo una pregunta para ti", { body: r.pregunta, icon: "/static/icon-192.png" });
    }
  }, 2 * 60 * 60 * 1000);
}

function escapar(t) {
  const d = document.createElement("div");
  d.textContent = t || "";
  return d.innerHTML;
}

cargarPregunta();
</script>
</body>
</html>
